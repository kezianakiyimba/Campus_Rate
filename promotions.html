<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promotions</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet">
    <link rel="stylesheet" href="stylesheet.css">
     <style>
        /* Hero slideshow styletag */
        .promo-hero {
            position: relative;
            isolation: isolate;
            overflow: hidden;
            background: #4a2c1d;
        }
        .promo-hero .carousel-item { height: 70vh; min-height: 420px; }
        .promo-hero .carousel-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;          /* fills the slide without stretching the photo */
        }
        /* Dark gradient so the text is readable on any photo */
        .promo-hero .carousel-item::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(40, 15, 10, 0.85) 0%, rgba(40, 15, 10, 0.1) 60%);
            pointer-events: none;
        }
        .promo-hero .carousel-caption {
            z-index: 2;
            text-align: left;
            left: 8%;
            right: 8%;
            bottom: 12%;
        }
        .promo-canteen-badge {
            display: inline-block;
            background: #c0392b;
            color: white;
            font-size: 14px;
            letter-spacing: 0.5px;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 10px;
        }
        .promo-hero h2 {
            font-family: 'Fraunces', Georgia, serif;
            font-size: clamp(28px, 5vw, 52px);
            margin-bottom: 8px;
        }
        .promo-hero p { font-size: clamp(15px, 2vw, 20px); max-width: 600px; }
        .promo-details-btn {
            background:  #f6ebdd;
            color: #4a2c1d;
            border: 0;
            border-radius: 30px;
            padding: 10px 24px;
            font-weight: 600;
            transition: transform 0.2s, background-color 0.2s;
        }
        .promo-details-btn:hover { background: #ffd93d; transform: translateY(-2px); }

        .promotions-gallery h3 { font-size: 30px; color: #6e1f1a; margin-bottom: 4px; }
        .promo-gallery > p { color: #4a2c1d; }
        .promo-thumb {
            display: block;
            width: 100%;
            padding: 0;
            background: white;
            border: 2px solid transparent;
            border-top: 5px solid #9b2c20;
            border-radius: 14px;
            overflow: hidden;
            text-align: left;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(74, 44, 29, 0.15);
            transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s;
        }
        .promo-thumb:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 24px rgba(74, 44, 29, 0.3);
        }
        .promo-thumb.active { border-color: #c0392b; }
        .promo-thumb img { width: 100%; height: 160px; object-fit: contain; display: block; }
        .promo-thumb .thumb-text { padding: 10px 12px; }
        .promo-thumb .thumb-canteen { font-size: 13px; color: #8a6a55; }
        .promo-thumb .thumb-title { font-size: 15px; font-weight: 600; color: #4a2c1d; }

        /*  Food Promotions Details pop-up when clicked */
        .promo-modal-img { width: 100%; height: 240px; object-fit: cover; }
        .promo-offer-tag {
            display: inline-block;
            background: #f3e0cc;
            color: #6e1f1a;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 8px;
        }
        .promo-meta { color: #8a6a55; font-size: 15px; }
    </style>

 </head>
<body>
     <nav id="navigation">
    <a class="logo" href="#top">Campus<span>Rate</span></a>
    <div class="links">
      <a href="campus_rate_landingpage.html">Home</a>
      <a href="ratings.html">Ratings</a>
      <a href="promotions.html">Promotions</a>
    </div>
  </nav> 
<section class="promo-hero" aria-label="Featured promotions">
    <div id="promoCarousel" class="carousel slide carousel-fade">
        <div class="carousel-inner" id="carouselSlides"></div>

        <button class="carousel-control-prev" type="button"
                data-bs-target="#promoCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous promotion</span>
        </button>
        <button class="carousel-control-next" type="button"
                data-bs-target="#promoCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next promotion</span>
        </button>
    </div>
</section>

    <p>Tap an offer to see the full details.</p></div>
    <div class="row g-3" id="thumbList"></div>

  const PLACEHOLDER = "data:image/svg+xml;utf8," + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500">' +
    '<rect width="100%" height="100%" fill="#9b2c20"/>' +
    '<text x="50%" y="50%" fill="#f3e0cc" font-size="32" font-family="Georgia" ' +
    'text-anchor="middle" dominant-baseline="middle">Add promotion image</text></svg>'
);  
const ON_ERROR = "this.onerror=null;this.src=PLACEHOLDER;";

const carouselSlides = document.getElementById("carouselSlides");

promotions.forEach((promo, index) => {
    const slide = document.createElement("div");
    slide.className = "carousel-item" + (index === 0 ? " active" : "");
    slide.innerHTML = `
        <img src="${promo.image}" class="d-block w-100" alt="${promo.title}" onerror="${ON_ERROR}">
        <div class="carousel-caption">
            <span class="promo-canteen-badge">${promo.canteen}</span>
            <h2>${promo.title}</h2>
            <p>${promo.short}</p>
            <a href="#" 
            class="promo-details-btn" 
            data-bs-toggle="modal" 
            data-bs-target="#promoModal"
            data-promo-index="${index}">View Details</a>
        </div>
    `;
    carouselSlides.appendChild(slide);
});
const carouselEl = document.getElementById("promoCarousel");
new bootstrap.Carousel(carouselEl, { interval: 5000, ride: "carousel" });
                      <!--IMAGE BUTTONS-->>

const thumbList = document.getElementById("thumbList");
promotions.forEach(function (promo, index) {
    const col = document.createElement("div");
    col.className = "col-6 col-md-4 col-lg-3";
    col.innerHTML =
        '<button type="button" class="promo-thumb' + (index === 0 ? ' active' : '') +
        '" data-index="' + index + '" aria-label="View details: ' + promo.title + '">' +
            '<img src="' + promo.image + '" alt="" onerror="' + ON_ERROR + '">' +
            '<div class="thumb-text">' +
                '<div class="thumb-canteen">' + promo.canteen + '</div>' +
                '<div class="thumb-title">' + promo.title + '</div>' +
            '</div>' +
        '</button>';
    thumbList.appendChild(col);
     });
function highlightThumb(activeIndex) {
    document.querySelectorAll(".promo-thumb").forEach(function (btn) {
        btn.classList.toggle("active", Number(btn.dataset.index) === activeIndex);
    });
}

carouselEl.addEventListener("slide.bs.carousel", function (event) {
    highlightThumb(event.to);   // event.to = the slide about to appear
});

const promoModal = document.getElementById("promoModal");

promoModal.addEventListener("show.bs.modal", function(event) {

    const button = event.relatedTarget;

    const index = Number(button.dataset.promoIndex);

    const promo = promotions[index];

    document.getElementById("promoModalImg").src = promo.image;

    document.getElementById("promoModalTitle").textContent = promo.title;

    document.getElementById("promoModalCanteen").textContent = promo.canteen;

    document.getElementById("promoModalOffer").textContent = promo.offer;

    document.getElementById("promoModalDetails").textContent = promo.details;

    document.getElementById("promoModalValid").textContent = promo.valid;

    document.getElementById("promoModalTerms").textContent = promo.terms;

});

</script>
<div class="modal fade" id="promoModal" tabindex="-1"
     aria-labelledby="promoModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
            <img id="promoModalImg" class="promo-modal-img" src="" alt="">
            <div class="modal-header">
                <h5 class="modal-title" id="promoModalTitle"></h5>
                <button type="button" class="btn-close"
                        data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p class="promo-meta mb-2" id="promoModalCanteen"></p>
                <p><span class="promo-offer-tag" id="promoModalOffer"></span></p>
                <p id="promoModalDetails"></p>
                <p class="promo-meta mb-1"><strong>Valid:</strong> <span id="promoModalValid"></span></p>
                <p class="promo-meta mb-0"><strong>Terms:</strong> <span id="promoModalTerms"></span></p>
            </div>
            <div class="modal-footer">
                <a href="ratings.html" class="rating-continue-button text-decoration-none">
                    Rate this canteen
                </a>
            </div>
        </div>
    </div>
</div>

</html>
